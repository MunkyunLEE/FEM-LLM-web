<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FEM-LLM-web</title>
<link rel="stylesheet" href="style.css">
<script type="importmap">{"imports": {"three": "./vendor/three.module.js"}}</script>
</head>
<body>
<div id="app">
  <aside id="left">
    <header><h1>FEM<span>·LLM</span></h1><div id="tools"></div></header>
    <section>
      <h2>지오메트리</h2>
      <div class="row"><select id="example"><option value="">예제 선택…</option></select></div>
      <div class="row two"><button id="loadPreset">예제 + 조건</button><button id="loadGeo" class="ghost">지오메트리만</button></div>
      <label class="file"><input type="file" id="file" accept=".obj,.stl"><span>OBJ / STL 올리기</span></label>
      <div class="row two"><label>STL 메쉬 크기 (mm)<input id="stlSize" type="number" min="0" step="any" placeholder="자동"></label><label>요소 분할수<input id="divisions" type="number" min="1" max="64" value="1"></label></div>
      <div id="modelInfo" class="info">불러온 모델이 없습니다</div>
    </section>
    <section>
      <h2>솔버 · 스텝</h2>
      <div class="row"><select id="solver"><option value="calculix">CalculiX (바·쉘 FEM)</option><option value="barhinge">바-힌지 (간이 검토)</option><option value="tensormesh">TensorMesh (솔리드)</option><option value="shell">자체 쉘 (대변형·자기 접촉·감쇠)</option><option value="bh">BH-web 바-힌지 (오리가미)</option></select></div>
      <div class="row two"><label>해석 종류<select id="stepType"><option value="static">정적</option><option value="buckle">좌굴</option><option value="modal">모달</option><option value="arclength">호장법</option><option value="kinematic">기구 (강체 접힘)</option></select></label><label class="check"><input type="checkbox" id="nlgeom">기하비선형</label></div>
      <div class="row three"><label>증분<input id="increments" type="number" min="1" value="25"></label><label>모드 수<input id="modes" type="number" min="1" value="5"></label><label>초기결함<input id="imperfection" type="number" step="any" value="0"></label></div>
      <div class="row two"><label>제어 방식<select id="control"><option value="load">하중 제어</option><option value="displacement">변위 제어</option></select></label><label>목표 변위 (mm)<input id="controlDisp" type="number" step="any" min="0" value="0" title="0이면 모델 크기의 5%"></label></div>
      <div class="row two"><label>변위 제어 방법<select id="controlKind"><option value="average">하중 분포 유지</option><option value="rigid">강체 압판</option></select></label><label class="check" title="바-힌지: 완전한 형상에서 분기점을 만나면 좌굴 가지로 전환"><input type="checkbox" id="branch">분기 전환</label></div>
      <div class="row three"><label title="자체 쉘 솔버 전용. 1·2차 모드 기준 감쇠비로 α, β 를 자동 계산">감쇠<select id="dampKind"><option value="none">없음 (정적)</option><option value="mass">질량 비례</option><option value="stiffness">강성 비례</option><option value="rayleigh">레일리</option></select></label><label>감쇠비 (%)<input id="dampZeta" type="number" step="any" min="0" value="0"></label><label title="0이면 1차 주기의 100배">스텝 시간 (s)<input id="dampTime" type="number" step="any" min="0" value="0"></label></div>
      <div class="row three"><label title="자체 쉘 솔버의 요소. 자동: 면이 모두 사각형이면 사각형 요소">쉘 요소<select id="element"><option value="auto">자동</option><option value="quad">사각형</option><option value="tri">삼각형</option></select></label><label title="하중·지정 변위가 커지는 모양 (자체 쉘 솔버)">증가 곡선<select id="amplitude"><option value="linear">선형</option><option value="smooth">부드럽게 (S자)</option></select></label><button id="addSelf" title="자체 쉘 솔버: 모든 면끼리의 접촉(자기 접촉 포함)">자기 접촉 추가</button></div>
      <div class="row three"><label title="자체 쉘 솔버의 요소 강성 계산 위치. 자동: GPU 가 있으면 GPU">계산 장치<select id="device"><option value="auto">자동</option><option value="cpu">CPU</option><option value="cuda">GPU (CUDA)</option><option value="mps">GPU (Apple)</option></select></label><label title="요소 강성만의 정밀도. 잔차는 항상 배정밀도라 수렴한 결과는 같음. 일반용 GPU 는 단정밀도가 훨씬 빠름">강성 정밀도<select id="precision"><option value="auto">자동</option><option value="float64">배정밀도</option><option value="float32">단정밀도 (빠름)</option></select></label><label title="0 이면 자동 (코어 절반, 최대 4)">CPU 스레드<input id="threads" type="number" min="0" step="1" value="0"></label></div>
    </section>
    <section>
      <h2>재료 · 단면 <small>mm · N · MPa</small></h2>
      <div class="row three"><label>E<input id="matE" type="number" step="any"></label><label>ν<input id="matNu" type="number" step="any"></label><label>항복<input id="matY" type="number" step="any" placeholder="없음"></label></div>
      <div class="row two"><label title="항복 뒤 응력 증가 기울기 (MPa). 곡선을 넣으면 무시">경화 계수<input id="matH" type="number" step="any" min="0" placeholder="0"></label><label title="진응력@소성변형률 을 쉼표로 구분. 예: 240@0, 275@0.02, 300@0.06">소성 곡선<input id="matCurve" type="text" placeholder="240@0, 275@0.02"></label></div>
      <div class="row three"><label>쉘 두께<input id="secT" type="number" step="any"></label><label>보 b<input id="secB" type="number" step="any"></label><label>보 h<input id="secH" type="number" step="any"></label></div>
      <div class="row two"><label>힌지 κ (N·mm/rad/mm)<input id="hingeK" type="number" step="any" placeholder="자동"></label><label>자동 비율 κ=r·D/L<input id="hingeR" type="number" step="any"></label></div>
      <div class="row two"><label>쉘 공유 엣지 힌지<select id="hingeAuto"><option value="off">끔 (OBJ의 hinge_ 선만)</option><option value="auto">자동 (그룹 경계 + 꺾인 엣지)</option><option value="groups">그룹 경계</option><option value="crease">꺾인 엣지</option><option value="all">모든 내부 엣지</option></select></label><label class="check"><input type="checkbox" id="hingePin">핀 조인트 (회전 자유)</label></div>
      <div id="hingeInfo" class="info"></div>
    </section>
    <section id="bhPanel" hidden>
      <h2>BH-web 바-힌지 <small id="bhCount"></small></h2>
      <div class="row three"><label title="자동: E, ν, t, L* 로 접힘 강성 계산. 퍼센트: 패널 굽힘강성 B=Et³/12(1-ν²) 대비 %. 값: N·mm/rad/mm 직접 지정">접힘 강성<select id="bhFoldMode"><option value="auto">자동 (수식)</option><option value="percent">패널 B 대비 %</option><option value="value">직접 값</option></select></label><label title="자동일 때 L*/w̄ (평균 패널 폭 배수). L* 를 직접 넣으면 그 값을 씀">L* / w̄<input id="bhLratio" type="number" step="any" min="0"></label><label id="bhPctBox">% 또는 값<input id="bhPct" type="number" step="any" min="0"></label></div>
      <div class="row three"><label title="바 항복 응력 (MPa). 비우면 탄성">바 항복<input id="bhBarY" type="number" step="any" min="0" placeholder="탄성"></label><label title="바 경화 계수 (MPa)">바 H<input id="bhBarH" type="number" step="any" min="0" placeholder="0"></label><label title="판정 각도 (도): 이보다 꺾인 공유 엣지를 접힘으로">자동 판정각<input id="bhTol" type="number" step="any" min="0"></label></div>
      <div class="row three"><label title="접힘 힌지 항복 모멘트 (N·mm/mm, 길이당). 비우면 탄성">접힘 항복<input id="bhFoldY" type="number" step="any" min="0" placeholder="탄성"></label><label title="접힘 힌지 경화 (N·mm/rad/mm)">접힘 H<input id="bhFoldH" type="number" step="any" min="0" placeholder="0"></label><label title="패널 휨 힌지 항복 (N·mm/mm)">휨 항복<input id="bhBendY" type="number" step="any" min="0" placeholder="탄성"></label></div>
      <div class="row three"><label class="check" title="기하 접촉: 면끼리 관통 방지 (IPC 장벽 + 연속 충돌 검사). 마찰·감쇠 없음"><input type="checkbox" id="bhContact">기하 접촉</label><label title="비우면 평균 바 길이의 0.1%">접촉 간격 (mm)<input id="bhGap" type="number" step="any" min="0" placeholder="자동"></label><label title="휨 힌지 경화 (N·mm/rad/mm)">휨 H<input id="bhBendH" type="number" step="any" min="0" placeholder="0"></label></div>
      <div class="row four"><label title="0 이면 한 번 가력. 1 이상이면 지정 변위를 0 → 목표 → 0 으로 반복">반복 하중 횟수<input id="bhCycles" type="number" min="0" step="1" placeholder="0"></label><label title="반복 하중의 하한을 목표 변위 대비 비율로. 0 이면 0 ↔ 목표, -0.1667 이면 목표 0.6 에서 -0.1 ↔ 0.6">반복 하한 비율<input id="bhCycLow" type="number" step="any" placeholder="0"></label><label title="바 단면적을 직접 지정 (mm²). 비우면 두께로 계산">바 면적<input id="bhArea" type="number" step="any" min="0" placeholder="자동"></label><label class="check" title="모드 해석에서 질량을 넣으면 K v = λ M v, 끄면 K v = λ v"><input type="checkbox" id="bhMass">모드에 질량</label></div>
      <div class="row"><button id="bhEdit" type="button" title="켜면 마우스 왼쪽 드래그가 상자 선택이 됩니다. 왼→오: 완전히 들어간 엣지, 오→왼: 걸친 엣지. Shift 추가, Ctrl 제외, Esc 해제, 클릭은 한 개">주름 편집 모드 끔</button></div>
      <div class="row four"><button class="bhType" data-t="fold" type="button">접힘</button><button class="bhType" data-t="bend" type="button">휨</button><button class="bhType" data-t="cut" type="button">자름</button><button class="bhType" data-t="auto" type="button">자동</button></div>
      <div class="row three"><button id="bhDrivers" type="button" title="선택한 주름을 기구 해석의 구동 주름으로">구동 주름 지정</button><label title="구동 주름의 목표 이면각 (도, 평면 = 180). 여러 개면 쉼표">목표 이면각<input id="bhTargets" type="text" placeholder="예: 60"></label><button id="bhClearDrv" class="ghost" type="button">구동 해제</button></div>
      <div class="row two"><button id="bhPlot3" type="button" title="선택한 접힘 주름 3개의 회전각으로 기구 해석 해공간 3D 그래프">3D 해공간 주름 (3개)</button><button id="bhWatch" type="button" title="선택한 주름의 각도·모멘트 이력을 결과에 기록">이력 기록 주름</button></div>
      <div id="bhSel" class="info"></div>
      <div class="legend" id="bhLegend"><span style="color:#ff6b5e">━ 접힘</span> <span style="color:#5ec8ff">━ 휨</span> <span style="color:#ffd84a">━ 자름</span> <span style="color:#7d8a99">━ 경계</span> <span style="color:#ffffff">━ 선택</span></div>
    </section>
    <section>
      <h2>구속 <small id="bcCount"></small></h2>
      <div id="bcList" class="list"></div>
      <h2>하중 <small id="ldCount"></small></h2>
      <div id="ldList" class="list"></div>
      <h2>접촉 <small id="ctCount"></small></h2>
      <div id="ctList" class="list"></div>
      <h2>기준점 커플링 <small id="cpCount"></small></h2>
      <div id="cpList" class="list"></div>
      <div id="warnings"></div>
      <div class="row"><button id="undo" class="ghost" type="button" disabled>되돌리기</button></div>
    </section>
    <section class="run">
      <button id="solve" class="primary">해석 실행</button>
      <button id="cancelSolve" class="danger" type="button" hidden>해석 강제 중단</button>
      <div class="row three"><a id="expInp" class="btn ghost" href="/api/export/inp">CalculiX .inp</a><a id="expAbq" class="btn ghost" href="/api/export/abaqus" title="해석 후 내보내면 초기 결함 좌표와 감쇠 계수가 자체 솔버와 같게 들어갑니다">Abaqus .inp</a><a id="expSpec" class="btn ghost" href="/api/export/spec">스펙 JSON</a></div>
      <div id="solveMsg" class="info"></div>
    </section>
  </aside>
  <main>
    <div id="viewer">
      <canvas id="gl"></canvas>
      <canvas id="gizmo" width="96" height="96"></canvas>
      <div id="hud"></div>
      <div id="legend" hidden><div id="legendTitle"></div><div id="legendBar"></div><div id="legendTicks"></div></div>
      <div id="viewbar">
        <button id="fit" title="화면 맞춤">맞춤</button>
        <label class="check"><input type="checkbox" id="showSymbols" checked>구속·하중</label>
        <label class="check"><input type="checkbox" id="showEdges" checked>요소 경계</label>
        <label class="check"><input type="checkbox" id="showResult" checked>결과</label>
        <label class="check" id="meshLinesWrap"><input type="checkbox" id="showMeshLines" checked>결과 메쉬선</label>
        <label class="check" id="thickWrap" hidden><input type="checkbox" id="showThick" checked>쉘 두께</label>
      </div>
      <div id="resultbar" hidden>
        <button id="play">▶</button>
        <input id="frame" type="range" min="0" max="0" value="0">
        <span id="frameLabel"></span>
        <select id="field"></select>
        <label>변형 배율<input id="scale" type="number" step="any" value="1"></label>
        <button id="autoScale" class="ghost">자동</button>
        <button id="savePng" class="ghost" title="지금 화면을 PNG 로 저장">PNG</button>
        <button id="saveGif" class="ghost" title="모든 프레임을 GIF 로 저장">GIF</button>
        <button id="saveVideo" class="ghost" title="모든 프레임을 영상으로 저장">영상</button>
      </div>
    </div>
    <div id="bottom">
      <div id="summary"></div>
      <div id="plots"></div>
    </div>
  </main>
  <aside id="right">
    <div class="topbar"><a id="theoryBtn" class="btn ghost" href="/theory.html" target="_blank" rel="noopener">Theory · 원리와 설계</a></div>
    <section class="llm">
      <h2>LLM <small id="llmStatus"></small></h2>
      <div class="row two"><label>방식<select id="llmMode"><option value="rule_first">규칙 우선 (모르면 LLM)</option><option value="auto">LLM 우선 (실패 시 규칙)</option><option value="llm">LLM만</option><option value="rule">규칙 기반만</option></select></label><label>모델<input id="llmModel" type="text" placeholder="예: gpt-4o-mini"></label></div>
      <div class="row"><label>엔드포인트 (OpenAI 호환)<input id="llmUrl" type="text" placeholder="비워 두면 규칙 기반만 사용 · 예: https://사내게이트웨이/v1"></label></div>
      <div class="row two"><label>API 키 (선택)<input id="llmKey" type="password" placeholder="필요한 경우만"></label><button id="llmSave" class="ghost">적용 · 확인</button></div>
      <div class="row"><button id="llmTest" class="ghost" type="button">실제 응답 테스트</button></div>
      <div id="llmInfo" class="info"></div>
    </section>
    <section class="chat">
      <h2>조건 · 결과 지시</h2>
      <div id="chips"></div>
      <div id="chatLog"></div>
      <form id="chatForm"><textarea id="chatInput" rows="3" placeholder="예: z 최소 면을 고정하고, 상단에 z 방향으로 -500 N 줘"></textarea><button class="primary" type="submit">보내기</button></form>
    </section>
  </aside>
</div>
<script type="module" src="app.js"></script>
</body>
</html>
